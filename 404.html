}

/* PIX BR Code (estático, com valor) */
function normAscii(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E]/g, '').toUpperCase(); }
function crc16pix(s) {
  let crc = 0xFFFF;
  for (let i = 0; i < s.length; i++) {
    crc ^= s.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
function pixPayload(valor, txid) {
  const f = (id, v) => id + String(v.length).padStart(2, '0') + v;
  const mai = f('00', 'br.gov.bcb.pix') + f('01', PAGAMENTO.pixChave);
  let pl = f('00', '01') + f('26', mai) + f('52', '0000') + f('53', '986');
  if (valor) pl += f('54', Number(valor).toFixed(2));
  pl += f('58', 'BR') + f('59', normAscii(PAGAMENTO.pixNome).slice(0, 25)) + f('60', normAscii(PAGAMENTO.pixCidade).slice(0, 15));
  pl += f('62', f('05', (txid || '***').slice(0, 25)));
  pl += '6304';
  return pl + crc16pix(pl);
}

async function rpc(fn, args) {
  const r = await fetch(SUPA_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function parseRef() {
  const seg = location.pathname.split('/').filter(Boolean).pop() || '';
  let m = seg.match(/^(\d+)-([a-z0-9]{4,10})$/i);
  if (!m) {
    const q = new URLSearchParams(location.search).get('p') || '';
    m = q.match(/^(\d+)-([a-z0-9]{4,10})$/i);
  }
  return m ? { n: parseInt(m[1], 10), t: m[2] } : null;
}

function erroHTML(msg) {

const sbAuth = (window.supabase && window.supabase.createClient)

  : null;
/* Login social temporariamente DESLIGADO (a pedido) — a sessão do Google ficava
   persistida no navegador e reaparecia em toda proposta. Para reativar quando o
   fluxo estiver validado, basta voltar para true. */
const SOCIAL_LOGIN = false;
let authUser = null; // { email, nome, provedor } quando o cliente entra com Google/Apple

async function loginSocial(provedor) {
  if (!sbAuth) { alert('Login social indisponível neste navegador. Use o e-mail abaixo.'); return; }
  const { error } = await sbAuth.auth.signInWithOAuth({
    provider: provedor,
    options: { redirectTo: location.origin + location.pathname + '?p=' + ref.n + '-' + ref.t },
  });
  if (error) {
    alert('Login com ' + (provedor === 'google' ? 'Google' : 'Apple') + ' ainda não está ativado. Preencha o e-mail manualmente abaixo por enquanto.');
  }
}

async function detectarSessaoSocial() {
  if (!sbAuth) return;
  try {
    const { data: { session } } = await sbAuth.auth.getSession();
    if (session && session.user) {
      const u = session.user;
      const meta = u.user_metadata || {};
      authUser = {
        email: (u.email || '').toLowerCase(),
        nome: meta.full_name || meta.name || '',
        provedor: (u.app_metadata && u.app_metadata.provider) || 'social',
      };
    }
  } catch (e) { authUser = null; }
}

/* Upgrade: cliente atual que adiciona acesso NMEA. Pré-instalado o sistema base,

const isUpgrade = () => String(p.kit || '').split(' + ').includes('#UPGRADE');
const isRenov = () => String(p.kit || '').split(' + ').includes('#RENOVACAO');
/* Frota B2B: composição codificada em marcador #B2B=<base64 json> */
function fleet() {
  const t = String(p.kit || '').split(' + ').find((k) => k.indexOf('#B2B=') === 0);
  if (!t) return null;
  try { return JSON.parse(decodeURIComponent(escape(atob(t.slice(5))))); } catch (e) { return null; }
}
/* Câmeras opcionais: quantidade codificada no marcador #CAM=<n> no campo kit */
function cams() {
  const t = String(p.kit || '').split(' + ').find((k) => k.indexOf('#CAM=') === 0);
  return t ? Math.max(0, parseInt(t.slice(5), 10) || 0) : 0;
}
const camImpl = () => cams() * camUnitImpl();              // acréscimo na implementação
/* VIB: quantidade de motores no marcador #VIB=<n> */
function vibs() {
  const t = String(p.kit || '').split(' + ').find((k) => k.indexOf('#VIB=') === 0);
  return t ? Math.min(8, Math.max(0, parseInt(t.slice(5), 10) || 0)) : 0;
}
const vibImpl = () => vibs() * VIB.impl;                   // implementação por motor (cobre o hardware de cada unidade)
const vibAssin = (plano) => vibs() * (plano === 'anual' ? VIB.anual : VIB.mensal);
/* Proposta EXCLUSIVA do VIB: só os sensores — sem kit base nem assinatura de R$249 */
const vibSolo = () => String(p.kit || '').split(' + ').indexOf('#VIBSOLO') !== -1;
const maqTxt = (n) => n + ' máquina' + (n > 1 ? 's' : '');
/* O que a implementação cobre — em upgrade e renovação ela pode ser leitura de
   motorização, sensor de corrente, câmeras, ou uma combinação. */
function itensImpl(comCameras) {
  const kit = String(p.kit || '').split(' + ');
  const l = [];
  if (p.rede === 'nmea' || p.rede === 'can') l.push('leitura de motorização');
  if (kit.includes('Sensor de consumo de bateria')) l.push('sensor de consumo de bateria');
  if (comCameras !== false && cams()) l.push(cams() + ' câmera' + (cams() > 1 ? 's' : ''));
  if (vibs()) l.push('VIB em ' + maqTxt(vibs()));
  return l;
}
const listaImpl = (comCameras) => {
  const l = itensImpl(comCameras);
  if (!l.length) return '';
  return l.length > 1 ? l.slice(0, -1).join(', ') + ' e ' + l[l.length - 1] : l[0];
};
const camAssin = (plano) => cams() * (plano === 'anual' ? CAMERA.anual : CAMERA.mensal); // acréscimo na assinatura (anual = 10 meses)
const implValor = () => Number(p.valor) + camImpl() + vibImpl(); // implementação total (sistema + câmeras + VIB)
const implIsento = () => implValor() === 0;
const REDE_NOME = { nenhuma: 'Sem rede NMEA/CAN', nmea: 'Rede NMEA', can: 'Rede CAN (com conversor)' };
/* Valor da assinatura do plano — por frota (B2B) ou fixo (B2C) */
function planoValor(plano) {
  if (vibSolo()) return 0;   // exclusivo VIB: a assinatura é só a dos sensores
  const f = fleet();
  if (f) return f.boats * (plano === 'anual' ? f.subAnual : f.subMensal);
  return PLANOS[plano] ? PLANOS[plano].valor : 0;
}
/* Assinatura TOTAL do plano — já com a mensalidade/anuidade das câmeras embutida.
   O cliente vê um número só (ex.: 249 + 29,90 = 278,90); o detalhe por câmera
   fica na seção da câmera, para o total não ficar fragmentado. */
const assinValor = (plano) => planoValor(plano) + camAssin(plano) + vibAssin(plano);
/* Economia do plano anual: 12 mensalidades completas menos a anuidade —
   com câmeras e VIB o desconto real cresce (2 mensalidades de TUDO). */
const economiaAnual = () => 12 * assinValor('mensal') - assinValor('anual');
const seloAnual = () => '2 meses grátis — economize ' + fmtBRL(economiaAnual()) + '/ano';
/* Upgrade: a assinatura mantém o VALOR, mas passa a ser contratada pelo sistema
   (mensal recorrente no cartão ou anuidade) — paga-se a implementação (do upgrade e
   das câmeras) e o acréscimo das câmeras na assinatura. Renovação e instalação
   nova: implementação + assinatura, ambas já com as câmeras embutidas. */
/* Desconto especial (#DESC=<pct>): aplica-se SOMENTE ao fechamento na
   anuidade — a mensalidade permanece no preço cheio. */
function descPct() {
  const t = String(p.kit || '').split(' + ').find((k) => k.indexOf('#DESC=') === 0);
  const n = t ? parseFloat(t.slice(6)) : 0;
  return (n > 0 && n < 90) ? n : 0;
}
const totalCom = (plano) => {
  const bruto = implValor() + assinValor(plano);
  if (plano === 'anual' && descPct()) return Math.round(bruto * (100 - descPct())) / 100;
  return bruto;
};
const descontoAnual = () => {
  if (!descPct()) return 0;
  return Math.round((implValor() + assinValor('anual') - totalCom('anual')) * 100) / 100;
};

/* Recorrência no cartão: obrigatória sempre que houver valor MENSAL a receber
   (B2C — frotas B2B são faturadas). Devolve o valor mensal e o link do plano. */
function recorrenciaInfo(plano) {
  if (plano !== 'mensal') return null;
  const v = assinValor('mensal');   // upgrade e renovação: assinatura cheia pelo sistema
  if (vibSolo()) return { valorMes: v, url: mpPlanoUrl('vib', v) };   // exclusivo VIB
  if (fleet()) {
    // frota: só entra na recorrência se existir plano criado para ESTE valor
    // (negociações sob medida); frotas padrão seguem no faturamento
    const url = mpPlanoUrl('full', v);
    return url ? { valorMes: v, url } : null;
  }
  return { valorMes: v, url: mpPlanoUrl('full', v) };
}

/* Seletor de forma de pagamento. Com plano MENSAL o cartão (recorrente) é
   obrigatório — o PIX fica restrito à implementação. */
function payOptsHTML() {
  if (recorrenciaObrigatoria(planoSel)) {
    pagSel = 'cartao';
    return '<div class="pay-opt sel" data-pag="cartao" style="flex:1;min-width:220px">💳 Cartão de crédito — assinatura recorrente</div>' +
      '<div style="flex-basis:100%;font-size:11.5px;color:#8A8F9C;margin-top:6px">No plano mensal a cobrança é <b>recorrente no cartão</b> (débito automático mensal, sem comprometer o limite).' +
      (implValor() ? ' A implementação (única) é paga no fechamento por <b>PIX ou cartão</b>, como preferir.' : '') + '</div>';
  }
  return '<div class="pay-opt' + (pagSel === 'pix' ? ' sel' : '') + '" data-pag="pix">💠 PIX (QR Code)</div>' +
    '<div class="pay-opt' + (pagSel === 'cartao' ? ' sel' : '') + '" data-pag="cartao">💳 Cartão de crédito</div>';
}
function wirePayOpts() {
  const trava = recorrenciaObrigatoria(planoSel);
  document.querySelectorAll('.pay-opt').forEach((el) => el.addEventListener('click', () => {
    if (trava) return;                        // mensal: cartão obrigatório
    pagSel = el.dataset.pag;
    document.querySelectorAll('.pay-opt').forEach((x) => x.classList.toggle('sel', x === el));
  }));
}
function updatePayOpts() {
  const d = document.getElementById('payOpts');
  if (d) { d.innerHTML = payOptsHTML(); wirePayOpts(); }
}

/* Quadro do desconto: 2 meses grátis da anuidade + desconto especial,
   empilhados e com o total final em destaque. Só aparece com #DESC. */
function descontoBoxHTML() {
  const pct = descPct();
  if (!pct || isUpgrade() || isRenov()) return '';
  const f = fleet();
  const mens12 = Math.round(12 * assinValor('mensal') * 100) / 100;
  const doisMeses = Math.round((mens12 - assinValor('anual')) * 100) / 100;
  const pct2m = Math.round((doisMeses / mens12) * 1000) / 10;
  const bruto = Math.round((implValor() + assinValor('anual')) * 100) / 100;
  const desc = descontoAnual();
  const total = totalCom('anual');
  const quem = f ? ' das ' + f.boats + ' embarcações' : '';
  const linha = (t, v) => '<div style="display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid #DCEEE2;font-size:13.5px"><span>' + t + '</span><b style="color:#0B6B4D;white-space:nowrap">' + v + '</b></div>';
  return '<section><div style="background:#F0FAF4;border:1.5px solid #9AD4AE;border-radius:16px;padding:20px 22px">' +
    '<div style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#0B6B4D;font-weight:800;margin-bottom:10px">🎁 Condição especial — fechando na anuidade</div>' +
    linha('2 meses grátis da anuidade (' + String(pct2m).replace('.', ',') + '% sobre 12 mensalidades)', '− ' + fmtBRL(doisMeses)) +
    linha('<b>Desconto especial de ' + pct + '%</b> — fechamento da anuidade' + quem + ' (sobre implementação + anuidade)', '− ' + fmtBRL(desc)) +
    '<div style="display:flex;justify-content:space-between;gap:14px;padding-top:12px;align-items:baseline"><span style="font-weight:800;color:#2D324B">Total no fechamento anual</span>' +
      '<span style="white-space:nowrap"><s style="color:#8A8F9C;font-size:14px">' + fmtBRL(bruto) + '</s> <b style="color:#0B6B4D;font-size:24px">' + fmtBRL(total) + '</b></span></div>' +
    '<div style="margin-top:8px;font-size:12px;color:#4E5666">Válido apenas para o plano anual — no mensal valem os valores integrais.</div>' +
  '</div></section>';
}

function ctaLabel() {
  if (!planoSel) {
    if (isRenov()) return 'Escolha mensal ou anual acima';
    return isUpgrade() ? 'Escolha mensal ou anual acima' : 'Aceitar termos e contratar';
  }
  const rec = recorrenciaInfo(planoSel);
  if (rec) {                                    // mensal: PIX da implementação + cartão recorrente
    const verbo = isRenov() ? 'Renovar' : 'Aceitar e contratar';
    return implValor()
      ? verbo + ' — ' + fmtBRL(implValor()) + ' (PIX) + ' + fmtBRL(rec.valorMes) + '/mês no cartão'
      : verbo + ' — ativar ' + fmtBRL(rec.valorMes) + '/mês no cartão';
  }
  if (isRenov()) return 'Renovar assinatura — pagar ' + fmtBRL(totalCom(planoSel)) + (planoSel === 'anual' ? ' (anuidade)' : ' (mensalidade)');
  return 'Aceitar termos e contratar — pagar ' + fmtBRL(totalCom(planoSel)) + ' (' + (implIsento() ? '' : 'implementação + ') + (planoSel === 'anual' ? 'anuidade' : '1ª mensalidade') + ')';
}

      '</div>';
  let inner;

  if (rec) {

    const resumoRec = '<div style="display:inline-block;text-align:left;margin:6px auto 2px;font-size:13px;color:#3A3F4E">' +

      '<div style="border-top:1px solid #E3E5EB;margin-top:6px;padding-top:6px;font-weight:800;color:#2D324B">Hoje (implementação) <span style="float:right;margin-left:26px;font-size:22px">' + (implValor() ? fmtBRL(implValor()) : 'R$ 0,00') + '</span></div>' +
      '</div>';
    const btnRec = rec.url
      ? '<a href="' + rec.url + '" target="_blank" rel="noopener"><button class="btnc" style="background:#2264BE">💳 Ativar assinatura no cartão — ' + fmtBRL(rec.valorMes) + '/mês</button></a>' +

    inner = '<div style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#8A8F9C;font-weight:700">Pagamento · assinatura recorrente' + (implValor() ? ' + implementação' : '') + '</div>' +
      resumoRec +
      '<div style="margin:6px 0 2px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#8A8F9C;font-weight:700">1 · Assinatura mensal no cartão</div>' +
      btnRec +

          (mpImplUrl(implValor())
            ? '<a href="' + mpImplUrl(implValor()) + '" target="_blank" rel="noopener"><button class="btnc" style="background:#2264BE">💳 Pagar implementação no cartão — ' + fmtBRL(implValor()) + '</button></a>' +

            : '') +

          '<div style="font-size:12.5px;color:#4E5666">Escaneie com o app do seu banco · Favorecido: ' + esc(PAGAMENTO.pixNome) + '</div>' +
          '<div class="copia" id="pixCopia"></div>' +
          '<button class="btnc" id="btnCopiaPix">📋 Copiar código PIX (copia e cola)</button>'
        : '');
  } else if ((p.pagamento || pagSel) === 'cartao' && PAGAMENTO.linkCartao) {
    inner = '<div style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#8A8F9C;font-weight:700">Pagamento · ' + cab + '</div>' +
      resumo +
      '<a href="' + PAGAMENTO.linkCartao + '" target="_blank"><button class="btnc">💳 Pagar com cartão de crédito</button></a>';
  } else if (PAGAMENTO.pixChave) {
    const urlCartao = cartaoAvulsoUrl();
    inner = '<div style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#8A8F9C;font-weight:700">Pagamento · ' + cab + '</div>' +
      resumo +

        ? '<a href="' + urlCartao + '" target="_blank" rel="noopener"><button class="btnc" style="background:#2264BE">💳 Pagar no cartão — ' + fmtBRL(total) + '</button></a>' +

        : '') +

      '<div style="font-size:12.5px;color:#4E5666">Escaneie com o app do seu banco · Favorecido: ' + esc(PAGAMENTO.pixNome) + '</div>' +
      '<div class="copia" id="pixCopia"></div>' +
      '<button class="btnc" id="btnCopiaPix">📋 Copiar código PIX (copia e cola)</button>';
  } else {
    inner = '<div style="font-size:15px;font-weight:700;color:#2D324B">Total a pagar (' + (implIsento() ? 'assinatura — implementação isenta' : 'implementação + assinatura') + '): ' + fmtBRL(total) + '</div>' +
      '<div style="margin-top:8px;font-size:13.5px;color:#4E5666">Nossa equipe entrará em contato pelo WhatsApp com os dados de pagamento.</div>';
  }

function wirePagamento() {
  if (PAGAMENTO.pixChave && document.getElementById('pixQr')) {
    // com recorrência no cartão, o PIX cobre apenas a implementação
    const valorPix = recorrenciaInfo(p.plano) ? implValor() : totalCom(p.plano);
    const payload = pixPayload(valorPix, 'SB' + String(p.numero).padStart(4, '0'));
    document.getElementById('pixCopia').textContent = payload;
    if (window.qrcode) {
      const qr = window.qrcode(0, 'M');
      qr.addData(payload);
      qr.make();
      document.getElementById('pixQr').innerHTML = qr.createImgTag(5, 8);
    }
    const b = document.getElementById('btnCopiaPix');
    if (b) b.addEventListener('click', () => {
      navigator.clipboard.writeText(payload).then(() => { b.textContent = '✓ Código copiado!'; });
    });
  }
}

/* Evidência da assinatura: snapshot integral do contrato aceito + hash SHA-256.
   O hash prova QUAL texto foi aceito; o snapshot preserva o contrato no banco
   mesmo que os termos publicados mudem depois. */
async function evidenciaContrato(ac) {
  try {
    const url = p.segmento === 'B2B' ? 'termos-b2b.html' : 'termos-b2c.html';
    const bruto = await (await fetch(url, { cache: 'no-store' })).text();
    const doc = new DOMParser().parseFromString(bruto, 'text/html');
    preencherContratoDOM(doc, ac);
    // congela o documento: sem scripts, o snapshot não depende de dados vivos
    doc.querySelectorAll('script').forEach((s) => s.remove());
    const html = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(html));
    const hash = Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
    return { hash, html };
  } catch (e) { return { hash: null, html: null }; }
}

/* Preenche o contrato com os dados do aceite e os valores efetivamente
   escolhidos. Roda ANTES de gravar, porque o banco ainda não tem o aceite. */
function preencherContratoDOM(doc, ac) {
  const set = (campo, valor) => {
    doc.querySelectorAll('[data-mf="' + campo + '"]').forEach((el) => {
      el.textContent = valor;
      el.classList.add('filled');
    });
  };
  const mostrar = (id) => { const el = doc.getElementById(id); if (el) el.style.display = ''; };
  const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const hoje = new Date();
  const plano = PLANOS[ac.plano];
  const f = fleet();
  const n = cams();
  const anual = ac.plano === 'anual';

  set('numero', String(p.numero).padStart(4, '0'));
  set('cliente', ac.nome);
  set('doc', ac.doc);
  set('email', ac.email);
  const emb = [p.barco, p.modelo].filter(Boolean).join(' — ');
  if (emb) set('embarcacao', emb);
  set('dataExtenso', hoje.getDate() + ' de ' + MESES[hoje.getMonth()] + ' de ' + hoje.getFullYear());

  // valores — exatamente os mesmos exibidos na proposta
  if (vibSolo()) set('valorImpl', 'não se aplica — a implantação desta contratação é exclusivamente a do VIB (Cláusula 3.7.2 e Anexo II)');
  else if (isRenov() && !Number(p.valor)) set('valorImpl', 'não se aplica (renovação sem alteração no sistema)');
  else if (isRenov()) set('valorImpl', fmtBRL(p.valor) + ' (implantação contratada nesta renovação — itens discriminados no Anexo I)');
  else if (!Number(p.valor)) set('valorImpl', 'isenta (cortesia SAFEBOAT)');
  else set('valorImpl', fmtBRL(p.valor) + (isUpgrade() ? ' (upgrade — adição de leitura de dados)' : ''));

  if (plano) {
    set('planoLabel', plano.label);
    set('valorAssin', vibSolo() ? 'composta exclusivamente pelo acréscimo do VIB (Cláusula 3.7.3)' : fmtBRL(planoValor(ac.plano)) + plano.sufixo);
  }
  set('valorTotal', fmtBRL(totalCom(ac.plano)));

  // frota (B2B)
  if (f) {
    set('boats', String(f.boats));
    set('subBarco', fmtBRL(anual ? f.subAnual : f.subMensal) + (anual ? '/ano' : '/mês'));
    set('subTotal', fmtBRL(planoValor(ac.plano)) + (anual ? '/ano' : '/mês'));
  }

  // câmeras (comodato)
  if (n > 0) {
    mostrar('clCamera'); mostrar('avLinhaCam'); mostrar('avLinhaCamAssin');
    set('camQtd', String(n));
    set('camImplVal', fmtBRL(camImpl()));
    set('camUnitAssin', fmtBRL(anual ? CAMERA.anual : CAMERA.mensal) + (anual ? '/ano' : '/mês'));
    set('camMensalVal', fmtBRL(camAssin(ac.plano)) + (anual ? '/ano' : '/mês'));
    set('avCamImpl', fmtBRL(camImpl()));
    set('avCamAssin', fmtBRL(camAssin(ac.plano)));
  }

  // VIB (comodato — sensor de vibração)
  const nv = vibs();
  if (nv > 0) {
    mostrar('clVib'); mostrar('avLinhaVib'); mostrar('avLinhaVibAssin');
    set('vibQtd', String(nv));
    set('vibImplVal', fmtBRL(vibImpl()));
    set('vibUnitAssin', fmtBRL(anual ? VIB.anual : VIB.mensal) + (anual ? '/ano' : '/mês'));
    set('vibAssinVal', fmtBRL(vibAssin(ac.plano)) + (anual ? '/ano' : '/mês'));
    set('avVibImpl', fmtBRL(vibImpl()));
    set('avVibAssin', fmtBRL(vibAssin(ac.plano)));
  }

  // renumeração da cláusula de total conforme os opcionais presentes
  if (n > 0 || nv > 0) {
    const nt = (n > 0 && nv > 0) ? '3.8' : '3.7';
    set('numTotal', nt); set('numTotalA', nt + '.1'); set('numTotalB', nt + '.2');
    set('numTotalCam', (n > 0 ? ' e 3.6.2' : '') + (nv > 0 ? ' e 3.7.2' : ''));
  }

  // Anexo I — itens cedidos em comodato
  const itens = String(p.kit || '').split(' + ').filter((k) => k && k.charAt(0) !== '#');
  if (n > 0) itens.push(n + ' × Câmera de segurança Wi-Fi Full HD');
  if (nv > 0) itens.push(nv + ' × Sensor de vibração VIB (um por motor)');
  const ul = doc.getElementById('anexoItens');
  if (ul && itens.length) {
    ul.innerHTML = '';
    itens.forEach((it) => { const li = doc.createElement('li'); li.textContent = it; ul.appendChild(li); });
  }

  // Anexo II — composição
  if (ac.plano === 'anual' && descPct()) {
    mostrar('avLinhaDesc');
    set('avDesc', '− ' + fmtBRL(descontoAnual()));
  }
  set('avImpl', Number(p.valor) ? fmtBRL(p.valor) : (isRenov() ? 'não se aplica' : 'isenta'));
  set('avPlano', plano ? plano.label : '—');
  set('avAssin', fmtBRL(planoValor(ac.plano)));
}

async function aceitarProposta() {
  const nome = document.getElementById('aNome').value.trim();
  const doc = document.getElementById('aDoc').value.trim();
  const email = (authUser ? authUser.email : document.getElementById('aEmail').value.trim().toLowerCase());
  if (!planoSel) { alert(isUpgrade() ? 'Confirme qual é o seu plano atual (mensal ou anual) na seção Investimento.' : 'Escolha o plano de assinatura (mensal ou anual) na seção Investimento.'); return; }
  if (!nome || !doc) { alert('Preencha seu nome completo e ' + (p.segmento === 'B2B' ? 'CNPJ' : 'CPF') + '.'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert('Informe um e-mail válido — ele será seu acesso ao app e receberá o contrato.'); return; }
  if (!document.getElementById('aTermos').checked) { alert('É necessário aceitar os Termos de Uso e o Contrato para contratar.'); return; }
  const btn = document.getElementById('btnAceitar');
  if (recorrenciaObrigatoria(planoSel)) pagSel = 'cartao';   // mensal: cartão obrigatório
  btn.disabled = true; btn.textContent = 'Registrando aceite…';
  const ev = await evidenciaContrato({ nome, doc, email, plano: planoSel });
  let ok = false;
  try {
    ok = await rpc('prop_aceitar', { n: ref.n, t: ref.t, p_nome: nome, p_doc: doc, p_plano: planoSel, p_pag: pagSel, p_hash: ev.hash, p_contrato: ev.html, p_email: email });
  } catch (e) {
    // banco ainda sem as colunas de evidência → registra o aceite básico
    try {
      ok = await rpc('prop_aceitar', { n: ref.n, t: ref.t, p_nome: nome, p_doc: doc, p_plano: planoSel, p_pag: pagSel });
    } catch (e2) { ok = false; }
  }
  if (!ok) {
    btn.disabled = false; btn.textContent = 'Tentar novamente';
    alert('Não foi possível registrar o aceite. Verifique sua conexão e tente de novo.');
    return;
  }
  const rows = await rpc('prop_get', { n: ref.n, t: ref.t });
  if (rows && rows.length) p = rows[0];
  renderAceite();
  document.getElementById('secAceite').scrollIntoView({ behavior: 'smooth' });
}

/* "Saiba mais": abre/fecha detalhes sem poluir a leitura; no PDF sai tudo. */
document.addEventListener('click', (e) => {
  const b = e.target.closest('.saiba');
  if (!b) return;
  const alvo = document.getElementById(b.dataset.alvo);
  if (!alvo) return;
  alvo.hidden = !alvo.hidden;
  b.textContent = alvo.hidden ? 'Saiba mais ▾' : 'Mostrar menos ▴';
});

main();
