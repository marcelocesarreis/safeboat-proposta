<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sirene de alarme">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c4c50"/>
      <stop offset="38%" stop-color="#242427"/>
      <stop offset="100%" stop-color="#060607"/>
    </linearGradient>
    <radialGradient id="mouth" cx="48%" cy="44%" r="66%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="68%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#2a2a2e"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c5c60"/>
      <stop offset="52%" stop-color="#1c1c1f"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <ellipse cx="205" cy="332" rx="150" ry="19" fill="#000000" opacity="0.12"/>

  <!-- suporte / bracket -->
  <path d="M 208 284 L 252 300 L 252 322 L 233 322 L 233 311 L 208 301 Z" fill="#1a1a1c" filter="url(#sh)"/>
  <circle cx="242" cy="312" r="4" fill="#000000"/>

  <g filter="url(#sh)">
    <!-- corpo cônico (traseira menor -> boca maior) -->
    <path d="M 300 120 A 34 78 0 0 1 300 276 L 155 298 A 88 103 0 0 0 155 92 Z" fill="url(#body)"/>
    <ellipse cx="300" cy="198" rx="34" ry="78" fill="#0c0c0e"/>
    <!-- boca / aro frontal -->
    <ellipse cx="155" cy="195" rx="88" ry="103" fill="url(#rim)"/>
    <ellipse cx="155" cy="195" rx="66" ry="81" fill="url(#mouth)"/>
    <ellipse cx="155" cy="195" rx="40" ry="50" fill="none" stroke="#000000" stroke-width="4" opacity="0.55"/>
    <ellipse cx="155" cy="195" rx="15" ry="18" fill="#1d1d20"/>
    <ellipse cx="150" cy="188" rx="6" ry="8" fill="#3c3c40" opacity="0.7"/>
  </g>
  <!-- brilho no aro -->
  <path d="M 103 132 A 88 103 0 0 0 94 238" fill="none" stroke="#6c6c70" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
</svg>
